name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api]' numpy scikit-learn matplotlib pandas PyYAML pytest ruff httpx
      - run: ruff check src scripts tests --select E4,E7,E9,F
      - run: pytest -q
